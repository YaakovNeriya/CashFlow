server {
    # Nginx מקשיב על פורט 80 (HTTP רגיל)
    listen 80;

    # קבצים סטטיים (CSS, JS) - Nginx מגיש אותם ישירות בלי לטרוח את Flask
    location /static/ {
        alias /app/static/;
    }

    # כל שאר הבקשות - מעביר אותן לשרת Flask שרץ בקונטיינר "web" על פורט 5000
    location / {
        proxy_pass http://web:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
