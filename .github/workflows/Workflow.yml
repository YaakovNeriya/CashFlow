name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: cashflow
          MYSQL_USER: cashflow_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_HOST: 127.0.0.1
      DB_USER: cashflow_user
      DB_PASSWORD: test_password
      DB_NAME: cashflow
      SECRET_KEY: test-secret-key

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v

  # Job שני: פריסה - טראפורם ודחיפת אימג'ים
  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Create tfvars file
        run: |
          echo "${{ secrets.TFVARS_FILE }}" > terraform/terraform.tfvars

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Apply (ECR Target)
        working-directory: ./terraform
        run: terraform apply -target=aws_ecr_repository.app -auto-approve

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: docker build -t cashflow:latest .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag and Push to Docker Hub
        run: |
          docker tag cashflow:latest ${{ secrets.DOCKER_USERNAME }}/cashflow:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/cashflow:latest

      - name: Tag and Push to ECR
        run: |
          ECR_URI=${{ steps.login-ecr.outputs.registry }}/cashflow-app
          docker tag cashflow:latest $ECR_URI:latest
          docker push $ECR_URI:latest

      - name: Terraform Apply (All Resources)
        working-directory: ./terraform
        run: terraform apply -auto-approve
