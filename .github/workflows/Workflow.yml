name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: cashflow
          MYSQL_USER: cashflow_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_HOST: 127.0.0.1
      DB_USER: cashflow_user
      DB_PASSWORD: test_password
      DB_NAME: cashflow
      SECRET_KEY: test-secret-key

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v

  # Job שני: פריסה - טראפורם ודחיפת אימג'ים
  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Create tfvars file
        run: |
          cat <<'EOF' > terraform/terraform.tfvars
          ${{ secrets.TFVARS_FILE }}
          gemini_api_key = "${{ secrets.GEMINI_API_KEY }}"
          groq_api_key = "${{ secrets.GROQ_API_KEY }}"
          EOF

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Import existing resources
        working-directory: ./terraform
        continue-on-error: true
        run: |
          terraform import aws_ecr_repository.app cashflow-app 2>/dev/null || true
          SG_ID=$(aws ec2 describe-security-groups --filters "Name=group-name,Values=cashflow-app-sg" --query "SecurityGroups[0].GroupId" --output text 2>/dev/null || echo "None")
          if [ "$SG_ID" != "None" ] && [ "$SG_ID" != "" ]; then
            terraform import aws_security_group.app_sg "$SG_ID" 2>/dev/null || true
          fi
          terraform import aws_iam_role.ec2_role cashflow-app-ec2-role 2>/dev/null || true
          terraform import aws_iam_instance_profile.ec2_profile cashflow-app-instance-profile 2>/dev/null || true

      - name: Terraform Apply (ECR Target)
        working-directory: ./terraform
        run: terraform apply -target=aws_ecr_repository.app -auto-approve

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: docker build -t cashflow:latest .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag and Push to Docker Hub
        run: |
          docker tag cashflow:latest ${{ secrets.DOCKER_USERNAME }}/cashflow:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/cashflow:latest

      - name: Tag and Push to ECR
        run: |
          ECR_URI=${{ steps.login-ecr.outputs.registry }}/cashflow-app
          docker tag cashflow:latest $ECR_URI:latest
          docker push $ECR_URI:latest

      - name: Terraform Apply (All Resources)
        working-directory: ./terraform
        run: terraform apply -auto-approve

      - name: Get EC2 Info
        id: ec2-info
        working-directory: ./terraform
        run: |
          IP=$(terraform output -raw public_ip)
          ID=$(terraform output -raw instance_id)
          echo "ip=$IP" >> $GITHUB_OUTPUT
          echo "id=$ID" >> $GITHUB_OUTPUT

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.ec2-info.outputs.ip }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 30s
          command_timeout: 15m
          script: |
            set -e
            echo "Waiting for cloud-init to finish (this may take 2-3 minutes)..."
            while [ ! -f /var/lib/cloud/instance/boot-finished ]; do sleep 5; done
            echo "Cloud-init finished!"
            
            # Dump cloud-init logs if there were errors
            cat /var/log/cloud-init-output.log | tail -n 20 || true
            
            cd /app
            sudo git config --global --add safe.directory /app
            sudo git pull
            # Update GROQ_API_KEY in .env (so new keys take effect without rebuilding EC2)
            if grep -q "^GROQ_API_KEY=" .env 2>/dev/null; then
              sudo sed -i "s|^GROQ_API_KEY=.*|GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}|" .env
            else
              echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" | sudo tee -a .env
            fi
            # Create a 2GB swap file to prevent Out-Of-Memory (OOM) crashes
            if [ ! -f /swapfile ]; then
              sudo fallocate -l 2G /swapfile
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
            fi
            # Login to ECR
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | sudo docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
            # Pull the new image and recreate containers
            sudo /usr/local/bin/docker-compose pull app
            sudo /usr/local/bin/docker-compose up -d --force-recreate app
