  # Job שני: בניית Image ודחיפה ל-Docker Hub ול-ECR
  build-and-push:
    runs-on: ubuntu-latest
    needs: test  # רץ רק אם הטסטים עברו!

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # התחברות ל-Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # התחברות ל-AWS
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # התחברות ל-ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # בניית ה-Image פעם אחת ודחיפה לשני המקומות
      - name: Build Docker Image
        run: docker build -t cashflow:latest .

      - name: Tag and Push to Docker Hub
        run: |
          docker tag cashflow:latest ${{ secrets.DOCKER_USERNAME }}/cashflow:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/cashflow:latest

      - name: Tag and Push to ECR
        run: |
          ECR_URI=${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}
          docker tag cashflow:latest $ECR_URI:latest
          docker push $ECR_URI:latest